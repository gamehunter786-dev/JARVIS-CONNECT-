<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="c9e90676aee54b492de8a42281c2f1db0b8e60cd" content="c9e90676aee54b492de8a42281c2f1db0b8e60cd" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>J.A.R.V.I.S. Connect
  BY HUSSAIN(GAME HUNTER)</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- PIN LOCK SCREEN -->
  <section id="lockScreen" class="lock-screen">
    <div class="lock-card">
      <div class="lock-icon">🔐</div>
      <h1>J.A.R.V.I.S.
      By Hussain</h1>
      <p class="lock-subtitle">SECURE ACCESS SYSTEM</p>
      <p>Enter your access key to continue</p>

      <form id="pinForm">
        <input
          id="pinInput"
          type="password"
          placeholder="Enter access PIN"
          autocomplete="off"
          required
        >
        <button type="submit">UNLOCK SYSTEM</button>
      </form>

      <p id="pinError" class="error" role="alert"></p>
      <div class="lock-footer">J.A.R.V.I.S. CONNECT</div>
    </div>
  </section>

  <!-- MAIN WEBSITE -->
  <main id="appContent" hidden>
    <header class="topbar">
      <div>
        <h1>J.A.R.V.I.S.</h1>
        <p>CONNECT • GLOBAL CHAT</p>
      </div>
      <span id="status">Connecting...</span>
    </header>

    <!-- LOGIN / REGISTER -->
    <section id="authPanel" class="panel">
      <h2 id="authTitle">Welcome Back</h2>
      <p id="authSubtitle">Sign in to continue</p>

      <div class="tabs">
        <button id="loginTab" type="button" class="tab active">Login</button>
        <button id="registerTab" type="button" class="tab">Register</button>
      </div>

      <form id="authForm">
        <div id="usernameGroup" hidden>
          <label for="usernameInput">Username</label>
          <input
            id="usernameInput"
            type="text"
            placeholder="Choose a username"
            maxlength="30"
            autocomplete="username"
          >
        </div>

        <label for="emailInput">Email</label>
        <input
          id="emailInput"
          type="email"
          placeholder="Enter your email"
          autocomplete="email"
          required
        >

        <label for="passwordInput">Password</label>
        <input
          id="passwordInput"
          type="password"
          placeholder="Enter your password"
          minlength="6"
          autocomplete="current-password"
          required
        >

        <button id="authSubmit" type="submit">LOGIN</button>
        <p id="authError" class="error" role="alert"></p>
      </form>
    </section>

    <!-- CHAT -->
    <section id="chatPanel" class="panel" hidden>
      <div class="profile-row">
        <div>
          <h2 id="profileUsername">User</h2>
          <p id="profileEmail"></p>
        </div>
        <button id="logoutBtn" class="secondary" type="button">Logout</button>
      </div>

      <p class="chat-label">GLOBAL CHAT</p>
      <div id="messages" class="messages">
        <p class="empty-message">Loading messages...</p>
      </div>

      <form id="chatForm" class="chat-form">
        <input
          id="messageInput"
          type="text"
          placeholder="Write a message..."
          maxlength="500"
          autocomplete="off"
          required
        >
        <button id="sendBtn" type="submit">SEND</button>
      </form>
      <p id="chatError" class="error" role="alert"></p>
    </section>

    <footer>J.A.R.V.I.S. CONNECT © 2026
    BY HUSSAIN</footer>
  </main>

  <script type="module" src="script.js"></script>
</body>
</html>
