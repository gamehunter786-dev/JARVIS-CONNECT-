
<div class="app">
  <header>
    <div class="logo">J</div>
    <div class="brand">
      <h1>J.A.R.V.I.S.</h1>
      <p>CONNECT • GLOBAL CHAT
Created by Hussain (Game Hunter)</p>
    </div>
    <span id="status">Connecting...</span>
  </header>

  <main id="messages" aria-live="polite">
    <div class="welcome">
      <div class="welcome-icon">✦</div>
      <h2>Welcome, Agent!</h2>
      <p>Connect and start a conversation.</p>
    </div>
  </main>

  <form id="chatForm">
    <input
      id="messageInput"
      type="text"
      placeholder="Type your message..."
      maxlength="500"
      autocomplete="off"
      required
    >
    <button id="sendBtn" type="submit" disabled>➤</button>
  </form>

  <footer>J.A.R.V.I.S. CONNECT © 2026</footer>
</div>
